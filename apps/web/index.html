<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the notch and home indicator; the safe-area tokens pad it back in. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12151a" />
    <!-- Added to the iPhone home screen, it opens full screen with a dark status bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Triumvirate" />
    <!-- use-credentials: the manifest sits behind the Cloudflare sign-in, so its request needs the cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <!-- Public (no sign-in needed): iOS fetches it without Safari's cookies. ?v= skips iOS's cached failed fetch. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <title>Triumvirate</title>
    <!-- App loader. It paints before the app's code arrives, so its styles are inline here; the values mirror
         the loader tokens in tokens.css (used as fallbacks until that file loads). App.tsx removes it once
         the first load settles, and the same animation keeps running the whole time, with no restart. -->
    <style>
      html, body { margin: 0; background: #0b0d10; }
      .boot {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-content: center; justify-items: center; gap: 20px;
        background: var(--surface-page, #0b0d10);
        font: 13px/1.4 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--loader-label, #5d6673); letter-spacing: 0.02em;
      }
      .boot__mark { width: var(--loader-mark-size, 72px); height: var(--loader-mark-size, 72px); overflow: visible; }
      .boot__slot { fill: none; stroke: var(--loader-unlit, rgb(193 175 41 / 0.22)); stroke-width: 6; }
      .boot__lit {
        fill: var(--loader-lit, #c1af29); opacity: 0; transform-box: fill-box; transform-origin: center;
        animation: boot-write var(--loader-cycle, 1800ms) infinite both;
        animation-delay: calc(var(--n) * var(--loader-step, 160ms));
      }
      /* Each diamond lights on the enter curve, holds while the others join, then lets go on the exit curve. */
      @keyframes boot-write {
        0% { opacity: 0; transform: scale(0.82); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
        14% { opacity: 1; transform: scale(1); }
        52% { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
        66%, 100% { opacity: 0; transform: scale(1); }
      }
      /* Data is in: the V completes, then the mark shrinks away on the exit curve. */
      .boot.is-resolved .boot__lit { animation: none; opacity: 1; transform: none; transition: opacity 120ms cubic-bezier(0, 0, 0.2, 1); }
      .boot.is-leaving { animation: boot-out var(--motion-normal, 200ms) var(--motion-exit, cubic-bezier(0.4, 0, 1, 1)) both; pointer-events: none; }
      @keyframes boot-out { to { opacity: 0; transform: scale(0.94); } }
      /* Reduced motion: no scaling, a slower opacity-only pulse that never drops below 30%. */
      @keyframes boot-calm { 0%, 100% { opacity: 0.3; } 30%, 55% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot__lit { animation-name: boot-calm; animation-duration: var(--loader-cycle, 2400ms); animation-timing-function: ease-in-out; }
        @keyframes boot-out { to { opacity: 0; } }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" class="boot" role="status">
      <!-- The V: two diamonds above, one below. --n is the order the V is written. -->
      <svg class="boot__mark" viewBox="96 137 320 238" aria-hidden="true">
        <path class="boot__slot" d="M174 145 L244 215 L174 285 L104 215 Z" />
        <path class="boot__slot" d="M256 227 L326 297 L256 367 L186 297 Z" />
        <path class="boot__slot" d="M338 145 L408 215 L338 285 L268 215 Z" />
        <path class="boot__lit" style="--n: 0" d="M174 145 L244 215 L174 285 L104 215 Z" />
        <path class="boot__lit" style="--n: 1" d="M256 227 L326 297 L256 367 L186 297 Z" />
        <path class="boot__lit" style="--n: 2" d="M338 145 L408 215 L338 285 L268 215 Z" />
      </svg>
      <span>Loading your Guardians</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
